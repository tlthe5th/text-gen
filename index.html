<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>text-gen — 3D Kinetic Text &amp; Sunburst Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040508;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
    }
    #hud {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 96vw;
      background: rgba(12, 16, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 12px;
      z-index: 10;
    }
    input[type="text"], select {
      background: #0b0f17;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
    }
    input[type="text"] {
      width: 210px;
      font-weight: 600;
    }
    label.mini {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: #334155; }
    button:active { transform: scale(0.98); }
    button.primary {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #090d16;
      border: none;
    }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #timer {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: #94a3b8;
      min-width: 70px;
      text-align: center;
    }
    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 16, 24, 0.85);
      border: 1px solid rgba(250, 204, 21, 0.35);
      color: #fde047;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      z-index: 10;
      display: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status"></div>
  <div id="canvas-wrap"></div>

  <div id="hud">
    <input id="phraseInput" type="text" maxlength="28" value="COVERT PSYOPS" placeholder="Enter any text..." aria-label="Text to animate" />
    <label class="mini">Shatter:
      <select id="shatterSelect"></select>
    </label>
    <label class="mini">Sun:
      <select id="sunSelect"></select>
    </label>
    <button id="applyBtn">Generate</button>
    <button id="pauseBtn">Pause</button>
    <span id="timer">00.0s / 15.0s</span>
    <button id="recordBtn" class="primary">Record 15s Video</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const DURATION = 15.0;
    const WIDTH = 1920;
    const HEIGHT = 1080;

    const wrap = document.getElementById('canvas-wrap');
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');
    const phraseInput = document.getElementById('phraseInput');
    const shatterSelect = document.getElementById('shatterSelect');
    const sunSelect = document.getElementById('sunSelect');
    const applyBtn = document.getElementById('applyBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const recordBtn = document.getElementById('recordBtn');

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(WIDTH, HEIGHT, false);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    function fitCanvas() {
      const aspect = WIDTH / HEIGHT;
      const winAspect = window.innerWidth / window.innerHeight;
      if (winAspect > aspect) {
        renderer.domElement.style.height = '100vh';
        renderer.domElement.style.width = 'auto';
      } else {
        renderer.domElement.style.width = '100vw';
        renderer.domElement.style.height = 'auto';
      }
    }
    window.addEventListener('resize', fitCanvas);
    fitCanvas();

    const scene = new THREE.Scene();
    const darkBg = new THREE.Color(0x030407);
    const dayBg = new THREE.Color(0xdbeafe);
    scene.background = darkBg.clone();
    scene.fog = new THREE.FogExp2(0x04060b, 0.055);

    const camera = new THREE.PerspectiveCamera(40, WIDTH / HEIGHT, 0.1, 200);
    camera.position.set(0, 0.4, 19);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(WIDTH, HEIGHT), 0.65, 0.55, 0.72);
    composer.addPass(bloomPass);

    function createStoneTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#686e78';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 18000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random() * 2.5 + 0.5;
        const v = Math.floor(70 + Math.random() * 95);
        ctx.fillStyle = `rgb(${v},${v},${v + 4})`;
        ctx.fillRect(x, y, r, r);
      }
      ctx.strokeStyle = 'rgba(20, 22, 28, 0.45)';
      for (let i = 0; i < 28; i++) {
        ctx.lineWidth = Math.random() * 1.4 + 0.4;
        ctx.beginPath();
        let x = Math.random() * 512;
        let y = Math.random() * 512;
        ctx.moveTo(x, y);
        for (let s = 0; s < 5; s++) {
          x += (Math.random() - 0.5) * 70;
          y += (Math.random() - 0.5) * 70;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(0.35, 0.35);
      return tex;
    }

    const stoneTex = createStoneTexture();
    const stoneMat = new THREE.MeshStandardMaterial({
      color: 0x8a929e,
      map: stoneTex,
      bumpMap: stoneTex,
      bumpScale: 0.045,
      roughness: 0.78,
      metalness: 0.12,
    });

    const sunMat = new THREE.MeshStandardMaterial({
      color: 0xffd166,
      emissive: new THREE.Color(0xff9e00),
      emissiveIntensity: 0.0,
      roughness: 0.35,
      metalness: 0.1,
    });

    const ambientLight = new THREE.AmbientLight(0x1b2436, 0.35);
    scene.add(ambientLight);

    const rimLight = new THREE.DirectionalLight(0x4f7cac, 0.9);
    rimLight.position.set(-6, 7, -8);
    scene.add(rimLight);

    const keyLight = new THREE.DirectionalLight(0xfff1d6, 0.35);
    keyLight.position.set(5, 6, 12);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const sunLight = new THREE.PointLight(0xffb703, 0, 65, 1.3);
    scene.add(sunLight);

    const monoMat = new THREE.MeshStandardMaterial({ color: 0x0b0e14, roughness: 0.95 });
    const monoSpecs = [
      [-11, -1.5, -9, 3.2, 12, 2.5],
      [-6.5, -2.2, -13, 4.0, 14, 3.0],
      [6.8, -1.8, -11, 3.6, 13, 2.8],
      [11.5, -1.2, -8, 3.0, 11, 2.4],
      [0, -4.8, -4, 34, 1.2, 26],
    ];
    monoSpecs.forEach(([x, y, z, w, h, d]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), monoMat);
      m.position.set(x, y, z);
      m.receiveShadow = true;
      scene.add(m);
    });

    const raysGroup = new THREE.Group();
    raysGroup.visible = false;
    scene.add(raysGroup);

    const rayMat = new THREE.MeshBasicMaterial({
      color: 0xffd166,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
    });

    for (let i = 0; i < 18; i++) {
      const angle = (i / 18) * Math.PI * 2;
      const len = 16 + (i % 3) * 4;
      const geom = new THREE.ConeGeometry(1.15, len, 16, 1, true);
      geom.translate(0, -len / 2, 0);
      const mesh = new THREE.Mesh(geom, rayMat);
      mesh.rotation.z = angle;
      mesh.rotation.x = (Math.random() - 0.5) * 0.35;
      raysGroup.add(mesh);
    }

    const sunCore = new THREE.Mesh(
      new THREE.SphereGeometry(0.62, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xfff8dc, transparent: true, opacity: 0 })
    );
    scene.add(sunCore);

    const textGroup = new THREE.Group();
    scene.add(textGroup);

    let loadedFont = null;
    let letterEntries = []; // { mesh, basePos, isShatter, isSun }
    let debris = [];

    function populateLetterSelectors(text) {
      const chars = [...text];
      const candidates = [];
      chars.forEach((ch, idx) => {
        if (ch.trim() !== '') candidates.push({ idx, label: `#${idx + 1} "${ch}"` });
      });

      shatterSelect.innerHTML = `<option value="-1">None</option>`;
      sunSelect.innerHTML = `<option value="-1">None</option>`;

      candidates.forEach((c) => {
        const optS = document.createElement('option');
        optS.value = String(c.idx);
        optS.textContent = c.label;
        shatterSelect.appendChild(optS);

        const optU = document.createElement('option');
        optU.value = String(c.idx);
        optU.textContent = c.label;
        sunSelect.appendChild(optU);
      });

      // Default to first char shattering and first 'O' (or second non-space char) as sun
      if (candidates.length > 0) {
        shatterSelect.value = String(candidates[0].idx);
      }
      const oMatch = candidates.find((c) => c.label.toUpperCase().includes('"O"'));
      if (oMatch) {
        sunSelect.value = String(oMatch.idx);
      } else if (candidates.length > 1) {
        sunSelect.value = String(candidates[1].idx);
      } else if (candidates.length === 1) {
        sunSelect.value = String(candidates[0].idx);
      }
    }

    function spawnDebris(origin) {
      debris.forEach((d) => scene.remove(d.mesh));
      debris = [];
      const shardGeo = new THREE.DodecahedronGeometry(0.16, 0);
      for (let i = 0; i < 65; i++) {
        const m = new THREE.Mesh(shardGeo, stoneMat);
        const s = 0.45 + Math.random() * 1.15;
        m.scale.set(s, s * (0.6 + Math.random() * 0.8), s);
        m.position.set(
          origin.x + (Math.random() - 0.5) * 0.9,
          origin.y + (Math.random() - 0.5) * 1.3,
          origin.z + (Math.random() - 0.5) * 0.5
        );
        scene.add(m);
        debris.push({
          mesh: m,
          vel: new THREE.Vector3(
            (Math.random() - 0.65) * 2.8,
            Math.random() * 2.2 + 0.4,
            (Math.random() - 0.3) * 2.6
          ),
          rot: new THREE.Vector3(
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8
          ),
        });
      }
    }

    function buildTextMeshes(rawText, keepSelectors = false) {
      if (!loadedFont) return;
      const clean = (rawText || 'COVERT PSYOPS').slice(0, 28);
      if (!keepSelectors) {
        populateLetterSelectors(clean);
      }

      while (textGroup.children.length > 0) {
        const child = textGroup.children[0];
        textGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
      }
      letterEntries = [];

      const shatterIdx = Number(shatterSelect.value);
      const sunIdx = Number(sunSelect.value);

      // Scale font slightly down for longer strings so it stays framed
      const lenFactor = clean.length > 14 ? Math.max(0.58, 14 / clean.length) : 1.0;
      const size = 1.28 * lenFactor;
      const height = 0.46 * lenFactor;
      const letterSpacing = 0.14 * lenFactor;

      const chars = [...clean];
      const built = [];
      let totalWidth = 0;

      chars.forEach((ch, idx) => {
        if (ch === ' ') {
          const spW = 0.65 * lenFactor;
          built.push({ idx, ch, width: spW, mesh: null });
          totalWidth += spW;
          return;
        }
        const geo = new TextGeometry(ch, {
          font: loadedFont,
          size,
          height,
          curveSegments: 10,
          bevelEnabled: true,
          bevelThickness: 0.045 * lenFactor,
          bevelSize: 0.032 * lenFactor,
          bevelSegments: 3,
        });
        geo.computeBoundingBox();
        const bb = geo.boundingBox;
        const w = bb.max.x - bb.min.x;
        const h = bb.max.y - bb.min.y;
        geo.translate(-bb.min.x - w / 2, -bb.min.y - h / 2, -height / 2);

        const isSun = idx === sunIdx;
        const mesh = new THREE.Mesh(geo, isSun ? sunMat : stoneMat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        built.push({ idx, ch, width: w, mesh, isSun, isShatter: idx === shatterIdx });
        totalWidth += w + letterSpacing;
      });

      let cursorX = -totalWidth / 2;
      let sunCenter = new THREE.Vector3(0, 0.15, 0);
      let foundSun = false;

      built.forEach((item) => {
        if (!item.mesh) {
          cursorX += item.width;
          return;
        }
        const x = cursorX + item.width / 2;
        item.mesh.position.set(x, 0.15, 0);
        textGroup.add(item.mesh);

        letterEntries.push({
          mesh: item.mesh,
          basePos: new THREE.Vector3(x, 0.15, 0),
          isShatter: item.isShatter,
          isSun: item.isSun,
        });

        if (item.isSun) {
          sunCenter.set(x, 0.15, 0);
          foundSun = true;
        }
        cursorX += item.width + letterSpacing;
      });

      if (!foundSun && letterEntries.length > 0) {
        sunCenter.copy(letterEntries[0].basePos);
      }

      sunLight.position.set(sunCenter.x, sunCenter.y, 0.1);
      sunCore.position.set(sunCenter.x, sunCenter.y, 0.0);
      raysGroup.position.set(sunCenter.x, sunCenter.y, -0.1);
    }

    let elapsed = 0;
    let paused = false;
    let shattered = false;
    let lastTime = performance.now();

    function resetTimeline() {
      elapsed = 0;
      shattered = false;
      debris.forEach((d) => scene.remove(d.mesh));
      debris = [];
      letterEntries.forEach((entry) => {
        entry.mesh.visible = true;
        entry.mesh.position.copy(entry.basePos);
        entry.mesh.rotation.set(0, 0, 0);
      });
      sunMat.emissiveIntensity = 0;
      sunLight.intensity = 0;
      sunCore.material.opacity = 0;
      raysGroup.visible = false;
      rayMat.opacity = 0;
      scene.background.copy(darkBg);
      scene.fog.color.setHex(0x04060b);
      scene.fog.density = 0.055;
      ambientLight.intensity = 0.35;
      keyLight.intensity = 0.35;
      bloomPass.strength = 0.65;
      lastTime = performance.now();
    }

    const loader = new FontLoader();
    loader.load(
      'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/fonts/helvetiker_bold.typeface.json',
      (font) => {
        loadedFont = font;
        buildTextMeshes(phraseInput.value, false);
        resetTimeline();
      }
    );

    phraseInput.addEventListener('change', () => {
      buildTextMeshes(phraseInput.value, false);
      resetTimeline();
    });

    shatterSelect.addEventListener('change', () => {
      buildTextMeshes(phraseInput.value, true);
      resetTimeline();
    });

    sunSelect.addEventListener('change', () => {
      buildTextMeshes(phraseInput.value, true);
      resetTimeline();
    });

    applyBtn.addEventListener('click', () => {
      paused = false;
      pauseBtn.textContent = 'Pause';
      buildTextMeshes(phraseInput.value, false);
      resetTimeline();
    });

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function updateScene(t, dt) {
      const camProgress = smoothstep(0, DURATION, t);
      camera.position.z = THREE.MathUtils.lerp(18.5, 13.8, camProgress);
      camera.position.x = THREE.MathUtils.lerp(-0.35, -0.75, smoothstep(4.5, 13.0, t));
      camera.position.y = 0.25 + Math.sin(t * 0.4) * 0.08;
      camera.lookAt(-0.2, 0.1, 0);

      const reveal = smoothstep(0.4, 3.4, t);
      keyLight.intensity = 0.25 + reveal * 1.1;
      rimLight.intensity = 0.6 + reveal * 1.2;

      const shatterEntry = letterEntries.find((e) => e.isShatter);
      if (shatterEntry && !shattered) {
        if (t >= 3.4 && t < 5.0) {
          const shake = ((t - 3.4) / 1.6) * 0.09;
          shatterEntry.mesh.position.x = shatterEntry.basePos.x + (Math.random() - 0.5) * shake;
          shatterEntry.mesh.position.y = shatterEntry.basePos.y + (Math.random() - 0.5) * shake;
          shatterEntry.mesh.rotation.z = (Math.random() - 0.5) * shake * 0.7;
        } else if (t >= 5.0) {
          shattered = true;
          shatterEntry.mesh.visible = false;
          spawnDebris(shatterEntry.basePos);
        }
      }

      if (debris.length > 0) {
        debris.forEach((d) => {
          d.vel.y -= 9.8 * dt;
          d.mesh.position.addScaledVector(d.vel, dt);
          d.mesh.rotation.x += d.rot.x * dt;
          d.mesh.rotation.y += d.rot.y * dt;
          d.mesh.rotation.z += d.rot.z * dt;
          if (d.mesh.position.y < -4.1) {
            d.mesh.position.y = -4.1;
            d.vel.y *= -0.28;
            d.vel.x *= 0.75;
            d.vel.z *= 0.75;
          }
        });
      }

      const sunIgnite = smoothstep(5.3, 9.8, t);
      const sunPeak = smoothstep(5.3, 12.5, t);
      sunMat.emissiveIntensity = sunIgnite * 4.2;
      sunLight.intensity = sunPeak * 58;
      sunCore.material.opacity = smoothstep(5.5, 8.2, t) * 0.95;
      sunCore.scale.setScalar(0.8 + sunPeak * 0.55);

      if (t >= 5.4) {
        raysGroup.visible = true;
        raysGroup.rotation.z += dt * 0.14;
        rayMat.opacity = smoothstep(5.4, 8.6, t) * 0.22;
      }

      const daylight = smoothstep(8.5, 14.2, t);
      scene.background.copy(darkBg).lerp(dayBg, daylight);
      scene.fog.color.copy(darkBg).lerp(new THREE.Color(0xe0f2fe), daylight);
      scene.fog.density = THREE.MathUtils.lerp(0.055, 0.008, daylight);
      ambientLight.intensity = THREE.MathUtils.lerp(0.35, 2.3, daylight);
      keyLight.intensity = THREE.MathUtils.lerp(1.35, 3.2, daylight);
      monoMat.color.setHex(0x0b0e14).lerp(new THREE.Color(0x94a3b8), daylight);
      bloomPass.strength = THREE.MathUtils.lerp(0.65, 0.42, daylight);
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      if (!paused) {
        elapsed += dt;
        if (elapsed > DURATION) elapsed = DURATION;
        updateScene(elapsed, dt);
        timerEl.textContent = `${elapsed.toFixed(1).padStart(4, '0')}s / 15.0s`;
      }
      composer.render();
    }
    requestAnimationFrame(animate);

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      lastTime = performance.now();
    });

    recordBtn.addEventListener('click', () => {
      if (!('MediaRecorder' in window)) {
        statusEl.style.display = 'block';
        statusEl.textContent = 'MediaRecorder is not supported in this browser.';
        return;
      }

      recordBtn.disabled = true;
      applyBtn.disabled = true;
      paused = false;
      pauseBtn.textContent = 'Pause';
      buildTextMeshes(phraseInput.value, true);
      resetTimeline();

      const stream = renderer.domElement.captureStream(30);
      const mimeTypes = [
        'video/mp4;codecs=avc1',
        'video/webm;codecs=vp9',
        'video/webm',
      ];
      const chosenMime = mimeTypes.find((m) => MediaRecorder.isTypeSupported(m)) || '';
      const recorder = chosenMime
        ? new MediaRecorder(stream, { mimeType: chosenMime, videoBitsPerSecond: 12_000_000 })
        : new MediaRecorder(stream);

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const isMp4 = chosenMime.includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        const slug = (phraseInput.value || 'text-gen')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '') || 'text-gen';
        const blob = new Blob(chunks, { type: chosenMime || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${slug}-15s.${ext}`;
        a.click();
        URL.revokeObjectURL(url);

        recordBtn.disabled = false;
        applyBtn.disabled = false;
        statusEl.textContent = `Downloaded ${slug}-15s.${ext}`;
        setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
      };

      statusEl.style.display = 'block';
      statusEl.textContent = 'Recording 15.0s at 1920×1080... keep this tab visible.';
      recorder.start();

      setTimeout(() => {
        if (recorder.state !== 'inactive') recorder.stop();
      }, (DURATION + 0.25) * 1000);
    });
  </script>
</body>
</html>
